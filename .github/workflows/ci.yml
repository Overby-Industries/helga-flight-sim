name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # The flight model and the flight computer are C++ built as a GDExtension, and
  # the extension ships for Windows, where MSVC accepts things GCC does not. A
  # missing <string> include once stopped the same build of its sibling project,
  # Aevoria Simulator, on Linux. Compiling with GCC catches that class of error.
  #
  # This checks that the C++ compiles and links. It does not load the result in
  # Godot, which the .gdextension manifest (Windows libraries only) would not
  # allow on Linux, and there are no native tests of the flight model yet.
  gdextension:
    name: GDExtension compiles (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # godot-cpp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Build
        run: scons platform=linux target=template_debug -j4
